name: release

# 发布载体。发布是**不可逆的对外动作**，只允许发生在显式的人为决策点上。
#
# 触发：`workflow_dispatch`（GitHub UI 手动运行）。
#
# 为什么**不再**由 `push: tags: ['v*']` 触发（2026-11-13 改）：
#   本仓是 monorepo，`v0.1.0-rc.N` 是**单一命名空间**，却服务 5 条独立版本线
#   （ui / tokens / tailwind-preset / shared / eslint-config）—— 谁 bump 都可能是「下一个 N」，
#   编号由人脑估算，与包版本没有绑定关系。
#   2026-11-13 取证结论：
#     · `v0.1.0-rc.57` / `v0.1.0-rc.58` 是 lightweight tag，打在 **shared** 的 bump 提交上；
#       真正的 ui 发版提交（f85bac4 / 523a8c3）**从未被打过 tag**，偏差 30+ 个提交；
#     · 任何一次 tag push 都会跑完整条发布链（verify → publish-npm → build:cdn → 推 autional/cdn
#       → Vercel 生产部署）；历史上 rc.44 / rc.45 是 **shared** 的版本号，却触发了 **ui** 的发布。
#   ⇒ 结论：git tag **不是**版本真源，真源 = 各包 package.json + npm dist-tag。
#     历史 tag 保留作遗迹，**勿增勿删**；若确需打标记，用 `<pkg>-v<version>`（例 `ui-v0.1.0-rc.58`），
#     不以 `v` 开头，故不会被旧规则误触。
#   口径与操作手册见 docs/RELEASING.md。
#
# 版本号从各包 package.json 读（publish-npm.mjs 自己判断「已上架则跳过」），**不从 ref 名推导** ——
# 所以从任何分支、任何 ref 手动触发都不会把版本弄错。
#
# 前置 secret（缺任何一个都会在 preflight 硬失败，不会静默跳过）：
#   NPM_TOKEN       @autional 作用域的 publish 权限
#   CDN_PUSH_TOKEN  对 autional/cdn 有 contents:write 的 PAT
#                   （跨仓推送不能用 GITHUB_TOKEN）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 前置自证：所需 secret 必须存在
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CDN_PUSH_TOKEN: ${{ secrets.CDN_PUSH_TOKEN }}
        run: |
          missing=0
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::缺少 secret NPM_TOKEN（@autional 作用域的 publish 权限）"; missing=1
          fi
          if [ -z "$CDN_PUSH_TOKEN" ]; then
            echo "::error::缺少 secret CDN_PUSH_TOKEN（对 autional/cdn 有 contents:write 的 PAT）"; missing=1
          fi
          if [ "$missing" = 1 ]; then
            echo "::error::发布前置不全。**不降级、不跳过** —— 静默跳过等于只发一半，而另一半要等到有人发现。"
            exit 1
          fi

      # ui 与 cdn 必须是**兄弟目录**：build-cdn / check-cdn / bump-cdn-version
      # 都按 ROOT/../cdn 找 CDN 工作区。GitHub 不允许 checkout 到 workspace 之外，
      # 所以把 ui 放进子目录，cdn 与它同级。
      - uses: actions/checkout@v4
        with:
          path: ui

      - uses: actions/checkout@v4
        with:
          repository: autional/cdn
          path: cdn
          token: ${{ secrets.CDN_PUSH_TOKEN }}

      # 手动触发的可审计锚点：tag 不再承担「版本标记」职责，所以把 ref / sha / 各包版本
      # 写进 job 日志，事后能从 run 记录里还原「这次发的是哪份代码、哪些版本」。
      - name: 发布上下文自证（ref / sha / 各包版本）
        working-directory: ui
        run: |
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          for p in ui tokens tailwind-preset shared; do
            printf '%-16s %s\n' "$p" "$(node -p "require('./packages/$p/package.json').version")"
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile

      # 发布**前**：16 项跑全，只排除那两项「断言交付面已与 SSOT 同步」的闸门。
      # 它们在发布之前按定义必然为红 —— 让它们变绿正是本次要做的事。
      # 允许清单写死在 scripts/verify.mjs 里（只此两键），不是通用 --skip。
      - name: 发布前置门（全部闸门，除 publish / cdn）
        working-directory: ui
        run: node scripts/verify.mjs --except publish,cdn

      # 与本地 release.mjs 共用同一个入口（scripts/publish-npm.mjs）—— 此前这里是裸
      # `pnpm -r publish`：对**已存在的版本**会冲突退出，于是「只改了 ui 一个包」的正常发版
      # 会被 tokens/preset/shared 的旧版本号挡住（第 59 轮实测）。读回 / latest 对齐 /
      # 一致性自证也都在这个脚本里（带「processing 传播窗口」重试）。
      - name: 发布 npm（单一入口：含读回 / latest 对齐 / 一致性自证）
        working-directory: ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm.mjs --tag rc

      - name: 重建 CDN 产物（版本目录名带内容指纹）
        working-directory: ui
        run: pnpm build:cdn

      # 发布**后**：补跑 CDN 契约。publish 一致性已由 publish-npm.mjs 自证（含传播等待重试）。
      - name: 发布后置门（CDN 契约）
        working-directory: ui
        run: node scripts/check-cdn.mjs

      - name: 提交并推送 CDN（推送即触发 Vercel 生产部署）
        working-directory: cdn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "CDN 产物无变化（内容指纹未变），无需提交。"
            exit 0
          fi
          VER=$(node -p "require('../ui/packages/tokens/package.json').version")
          git add -A
          git commit -m "chore: 发布 v$VER"
          git push

      - name: 剩余的手工步骤（刻意不自动化，且忘了会被闸门抓住）
        run: |
          echo "::notice::CDN 已推送。剩余手工步骤：在 ui 仓跑 pnpm bump:cdn --write，然后逐站提交 chore(cdn)。"
          echo "::notice::不自动化这两个动作，是因为 CDN push 与站点提交都是对外发布动作，而站点改动会改变渲染 —— 本仓惯例是逐站构建 + 视觉回归后再接受。"
          echo "::notice::忘了也不会被静默放过：build-cdn 已清掉旧版本目录，站点的 <link> 随即 404，check-assets 的 cdnDelivered() 断言直接报红。"
